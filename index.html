
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الحروف الإنجليزية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 5px;
        }
        #score {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 20px;
        }
        #letter {
            font-size: 5em;
            font-weight: bold;
            color: #ff6b6b;
            background: #ffe3e3;
            border-radius: 50%;
            width: 150px;
            height: 150px;
            line-height: 150px;
            margin: 0 auto 30px auto;
        }
        .options-container {
            display: flex;
            justify-content: space-around;
            gap: 15px;
        }
        button {
            flex: 1;
            padding: 15px;
            font-size: 1.5em;
            border: none;
            border-radius: 10px;
            background-color: #4ecdc4;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        button:hover {
            background-color: #45b7af;
            transform: scale(1.05);
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        #feedback {
            margin-top: 20px;
            font-size: 1.5em;
            font-weight: bold;
            min-height: 35px;
        }
        .correct { color: #2ecc71; }
        .wrong { color: #e74c3c; }
        #restart-btn {
            display: none;
            background-color: #f39c12;
            margin-top: 20px;
            width: 100%;
        }
        #restart-btn:hover { background-color: #d68910; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>لعبة الحروف</h1>
        <div id="score">المرحلة: 1 / 26</div>
        <div id="letter">Aa</div>
        <div class="options-container" id="options">
            <button onclick="checkAnswer(this)">Apple</button>
            <button onclick="checkAnswer(this)">Banana</button>
        </div>
        <div id="feedback"></div>
        <button id="restart-btn" onclick="restartGame()">العب مرة أخرى</button>
    </div>

    <script>
        // مصفوفة الحروف والكلمات (A-Z)
        const gameData = [
            { letter: 'Aa', correct: 'Apple', wrong: 'Orange' },
            { letter: 'Bb', correct: 'Bear', wrong: 'Fish' },
            { letter: 'Cc', correct: 'Cat', wrong: 'Dog' },
            { letter: 'Dd', correct: 'Dog', wrong: 'Bird' },
            { letter: 'Ee', correct: 'Elephant', wrong: 'Tiger' },
            { letter: 'Ff', correct: 'Frog', wrong: 'Mouse' },
            { letter: 'Gg', correct: 'Giraffe', wrong: 'Lion' },
            { letter: 'Hh', correct: 'Horse', wrong: 'Snake' },
            { letter: 'Ii', correct: 'Ice cream', wrong: 'Cake' },
            { letter: 'Jj', correct: 'Juice', wrong: 'Water' },
            { letter: 'Kk', correct: 'Kite', wrong: 'Car' },
            { letter: 'Ll', correct: 'Lion', wrong: 'Zebra' },
            { letter: 'Mm', correct: 'Monkey', wrong: 'Rabbit' },
            { letter: 'Nn', correct: 'Nest', wrong: 'Tree' },
            { letter: 'Oo', correct: 'Orange', wrong: 'Apple' },
            { letter: 'Pp', correct: 'Penguin', wrong: 'Bear' },
            { letter: 'Qq', correct: 'Queen', wrong: 'King' },
            { letter: 'Rr', correct: 'Rabbit', wrong: 'Turtle' },
            { letter: 'Ss', correct: 'Sun', wrong: 'Moon' },
            { letter: 'Tt', correct: 'Tiger', wrong: 'Elephant' },
            { letter: 'Uu', correct: 'Umbrella', wrong: 'Hat' },
            { letter: 'Vv', correct: 'Van', wrong: 'Bus' },
            { letter: 'Ww', correct: 'Water', wrong: 'Fire' },
            { letter: 'Xx', correct: 'Xylophone', wrong: 'Guitar' },
            { letter: 'Yy', correct: 'Yak', wrong: 'Cow' },
            { letter: 'Zz', correct: 'Zebra', wrong: 'Horse' }
        ];

        let currentIndex = 0;

        const letterElement = document.getElementById('letter');
        const optionsContainer = document.getElementById('options');
        const feedbackElement = document.getElementById('feedback');
        const scoreElement = document.getElementById('score');
        const restartBtn = document.getElementById('restart-btn');

        function loadLevel() {
            const currentData = gameData[currentIndex];
            letterElement.textContent = currentData.letter;
            scoreElement.textContent = `المرحلة: ${currentIndex + 1} / 26`;
            feedbackElement.textContent = "";
            
            // خلط الخيارات عشوائياً حتى لا يكون الجواب الصحيح دائماً في نفس المكان
            const options = [currentData.correct, currentData.wrong];
            options.sort(() => Math.random() - 0.5);

            optionsContainer.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, currentData.correct);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedWord, correctWord) {
            // تعطيل الأزرار بعد الاختيار
            const buttons = optionsContainer.querySelectorAll('button');
            buttons.forEach(btn => btn.disabled = true);

            if (selectedWord === correctWord) {
                feedbackElement.textContent = "إجابة صحيحة! 🎉";
                feedbackElement.className = "correct";
                
                setTimeout(() => {
                    currentIndex++;
                    if (currentIndex < gameData.length) {
                        loadLevel();
                    } else {
                        endGame();
                    }
                }, 1000); // الانتقال للحرف التالي بعد ثانية
            } else {
                feedbackElement.textContent = "حاول مرة أخرى ❌";
                feedbackElement.className = "wrong";
                
                // إعادة تفعيل الأزرار للمحاولة من جديد
                setTimeout(() => {
                    buttons.forEach(btn => btn.disabled = false);
                    feedbackElement.textContent = "";
                }, 1000);
            }
        }

        function endGame() {
            letterElement.textContent = "🎉";
            optionsContainer.innerHTML = "<h2>أحسنت! لقد أكملت جميع الحروف!</h2>";
            scoreElement.textContent = "اكتملت اللعبة";
            feedbackElement.textContent = "";
            restartBtn.style.display = "block";
        }

        function restartGame() {
            currentIndex = 0;
            restartBtn.style.display = "none";
            loadLevel();
        }

        // بدء اللعبة
        loadLevel();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الحروف والأرقام للأطفال 🎈</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #74ebe5 0%, #eef1f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 15px;
        }
        .game-card {
            background: white;
            padding: 25px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 4px solid #4a90e2;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .badge {
            background: #ffecb3;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: #d84315;
            font-size: 1.1rem;
        }
        .type-tag {
            background: #e1f5fe;
            color: #0288d1;
            padding: 6px 14px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .display-box {
            background: #f9f9f9;
            border: 3px dashed #cbd5e1;
            border-radius: 20px;
            padding: 20px;
            margin: 15px 0;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .main-symbol {
            font-size: 4rem;
            font-weight: 900;
            color: #2b6cb0;
        }
        .visual-items {
            font-size: 2.5rem;
            letter-spacing: 5px;
            margin-top: 10px;
            word-break: break-word;
        }
        .question-text {
            font-size: 1.3rem;
            color: #4a5568;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .option-btn {
            background: #ffffff;
            border: 3px solid #e2e8f0;
            border-radius: 18px;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2d3748;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .option-btn:hover {
            transform: scale(1.03);
            border-color: #3182ce;
            background: #ebf8ff;
        }
        .feedback {
            margin-top: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 35px;
        }
    </style>
</head>
<body>

<div class="game-card">
    <div class="top-bar">
        <span class="type-tag" id="game-mode">مرحلة الأرقام 🔢</span>
        <span class="badge">النقاط: <span id="score">0</span> ⭐</span>
    </div>

    <div class="display-box">
        <div class="main-symbol" id="symbol">4</div>
        <div class="visual-items" id="visuals">⚽️ ⚽️ ⚽️ ⚽️</div>
    </div>

    <div class="question-text" id="question">كم عدد الكرات في الشاشة؟</div>

    <div class="options-grid" id="options"></div>

    <div class="feedback" id="feedback"></div>
</div>

<script>
    const questions = [
        // قسم الأرقام والتعديد
        {
            mode: "مرحلة الأرقام 🔢",
            symbol: "Number 4",
            visuals: "⚽️ ⚽️ ⚽️ ⚽️",
            question: "كم عدد الكرات في الصورة؟",
            correct: "4 (Four)",
            options: ["3 (Three)", "4 (Four)", "5 (Five)", "2 (Two)"]
        },
        {
            mode: "مرحلة الأرقام 🔢",
            symbol: "Number 2",
            visuals: "🚗 🚗",
            question: "كم عدد السيارات الموجودة؟",
            correct: "2 (Two)",
            options: ["1 (One)", "4 (Four)", "2 (Two)", "3 (Three)"]
        },
        {
            mode: "مرحلة الأرقام 🔢",
            symbol: "Number 5",
            visuals: "⭐️ ⭐️ ⭐️ ⭐️ ⭐️",
            question: "عد النجوم واختر الرقم الصحيح:",
            correct: "5 (Five)",
            options: ["5 (Five)", "6 (Six)", "4 (Four)", "3 (Three)"]
        },
        // قسم الحروف
        {
            mode: "مرحلة الحروف 🔤",
            symbol: "A a",
            visuals: "🍎",
            question: "ما هي الكلمة التي تبدأ بحرف A؟",
            correct: "Apple (تفاحة)",
            options: ["Banana (موز)", "Apple (تفاحة)", "Cat (قطة)", "Dog (كلب)"]
        },
        {
            mode: "مرحلة الحروف 🔤",
            symbol: "B b",
            visuals: "🍌",
            question: "اختر الكلمة المناسبة لحرف B:",
            correct: "Banana (موز)",
            options: ["Elephant (فيل)", "Cat (قطة)", "Banana (موز)", "Apple (تفاحة)"]
        },
        {
            mode: "مرحلة الحروف 🔤",
            symbol: "C c",
            visuals: "🐱",
            question: "أي كلمة تبدأ بحرف C؟",
            correct: "Cat (قطة)",
            options: ["Dog (كلب)", "Cat (قطة)", "Car (سيارة)", "Bird (عصفور)"]
        }
    ];

    let currentIndex = 0;
    let score = 0;

    function loadQuestion() {
        const q = questions[currentIndex];
        document.getElementById("game-mode").innerText = q.mode;
        document.getElementById("symbol").innerText = q.symbol;
        document.getElementById("visuals").innerText = q.visuals;
        document.getElementById("question").innerText = q.question;
        document.getElementById("feedback").innerText = "";

        const optionsContainer = document.getElementById("options");
        optionsContainer.innerHTML = "";

        q.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, q.correct);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selected, correct) {
        const feedback = document.getElementById("feedback");
        if (selected === correct) {
            score += 10;
            document.getElementById("score").innerText = score;
            feedback.style.color = "#2e7d32";
            feedback.innerText = "بطل! إجابة صحيحة 👏🎉";
            
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % questions.length;
                loadQuestion();
            }, 1200);
        } else {
            feedback.style.color = "#c62828";
            feedback.innerText = "حاول مرة ثانية ❌";
        }
    }

    loadQuestion();
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الحروف</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #bdf2ff; /* لون الخلفية الأزرق الفاتح */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        .game-wrapper {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
            padding: 20px;
            text-align: center;
            border: 5px solid #ffffff;
            outline: 5px solid #82d8ff;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .title {
            background-color: #3498db;
            color: white;
            padding: 10px 30px;
            border-radius: 15px;
            font-size: 1.8em;
            font-weight: bold;
            box-shadow: 0 4px 0 #2980b9;
            margin: 0 auto;
        }
        .stage {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }
        .letter-container {
            margin: 30px 0;
        }
        .letter-circle {
            background-color: #ff4757;
            color: white;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4.5em;
            font-weight: bold;
            margin: 0 auto;
            border: 5px solid #c0392b;
            box-shadow: 0 8px 15px rgba(255, 71, 87, 0.3);
        }
        .instruction {
            font-size: 1.4em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .options-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .option-card {
            background-color: white;
            border: 4px solid #3498db;
            border-radius: 15px;
            padding: 20px;
            width: 150px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .option-card:hover {
            transform: scale(1.05);
            border-color: #f1c40f;
        }
        .option-card:disabled {
            cursor: not-allowed;
            transform: none;
            opacity: 0.7;
        }
        .option-image {
            font-size: 5em; /* حجم الرمز التعبيري */
            margin-bottom: 10px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* إذا كنت ستستخدم صور حقيقية، سيتم تطبيق هذا التنسيق */
        .option-image img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }
        .option-word {
            font-size: 1.5em;
            font-weight: bold;
            color: #555;
        }
        .feedback {
            font-size: 1.5em;
            font-weight: bold;
            min-height: 35px;
            margin-top: 10px;
        }
        .correct { color: #2ecc71; }
        .wrong { color: #e74c3c; }
        .restart-btn {
            display: none;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.5em;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            box-shadow: 0 4px 0 #27ae60;
        }
        .restart-btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="header">
            <div class="stage" id="score">المرحلة: 1 / 26</div>
            <div class="title">لعبة الحروف</div>
            <div style="width: 80px;"></div> <!-- توازن للمسافة -->
        </div>

        <div class="letter-container">
            <div class="letter-circle" id="letter">Aa</div>
        </div>

        <div class="instruction">اختر الكلمة التي تبدأ بالحرف:</div>

        <div class="options-container" id="options">
            <!-- سيتم إضافة البطاقات هنا برمجياً -->
        </div>

        <div class="feedback" id="feedback"></div>
        <button class="restart-btn" id="restart-btn" onclick="restartGame()">العب مرة أخرى</button>
    </div>

    <script>
        // مصفوفة الحروف والكلمات والصور (باستخدام Emojis كصور افتراضية)
        const gameData = [
            { letter: 'Aa', correct: { word: 'Apple', img: '🍎' }, wrong: { word: 'Orange', img: '🍊' } },
            { letter: 'Bb', correct: { word: 'Bear', img: '🐻' }, wrong: { word: 'Fish', img: '🐟' } },
            { letter: 'Cc', correct: { word: 'Cat', img: '🐱' }, wrong: { word: 'Dog', img: '🐶' } },
            { letter: 'Dd', correct: { word: 'Dog', img: '🐶' }, wrong: { word: 'Bird', img: '🐦' } },
            { letter: 'Ee', correct: { word: 'Elephant', img: '🐘' }, wrong: { word: 'Tiger', img: '🐅' } },
            { letter: 'Ff', correct: { word: 'Frog', img: '🐸' }, wrong: { word: 'Mouse', img: '🐭' } },
            { letter: 'Gg', correct: { word: 'Giraffe', img: '🦒' }, wrong: { word: 'Lion', img: '🦁' } },
            { letter: 'Hh', correct: { word: 'Horse', img: '🐴' }, wrong: { word: 'Snake', img: '🐍' } },
            { letter: 'Ii', correct: { word: 'Ice cream', img: '🍦' }, wrong: { word: 'Cake', img: '🍰' } },
            { letter: 'Jj', correct: { word: 'Juice', img: '🧃' }, wrong: { word: 'Water', img: '💧' } },
            { letter: 'Kk', correct: { word: 'Kite', img: '🪁' }, wrong: { word: 'Car', img: '🚗' } },
            { letter: 'Ll', correct: { word: 'Lion', img: '🦁' }, wrong: { word: 'Zebra', img: '🦓' } },
            { letter: 'Mm', correct: { word: 'Monkey', img: '🐒' }, wrong: { word: 'Rabbit', img: '🐰' } },
            { letter: 'Nn', correct: { word: 'Nest', img: '🪹' }, wrong: { word: 'Tree', img: '🌳' } },
            { letter: 'Oo', correct: { word: 'Orange', img: '🍊' }, wrong: { word: 'Apple', img: '🍎' } },
            { letter: 'Pp', correct: { word: 'Penguin', img: '🐧' }, wrong: { word: 'Bear', img: '🐻' } },
            { letter: 'Qq', correct: { word: 'Queen', img: '👸' }, wrong: { word: 'King', img: '🤴' } },
            { letter: 'Rr', correct: { word: 'Rabbit', img: '🐰' }, wrong: { word: 'Turtle', img: '🐢' } },
            { letter: 'Ss', correct: { word: 'Sun', img: '☀️' }, wrong: { word: 'Moon', img: '🌙' } },
            { letter: 'Tt', correct: { word: 'Tiger', img: '🐅' }, wrong: { word: 'Elephant', img: '🐘' } },
            { letter: 'Uu', correct: { word: 'Umbrella', img: '☂️' }, wrong: { word: 'Hat', img: '🎩' } },
            { letter: 'Vv', correct: { word: 'Van', img: '🚐' }, wrong: { word: 'Bus', img: '🚌' } },
            { letter: 'Ww', correct: { word: 'Water', img: '💧' }, wrong: { word: 'Fire', img: '🔥' } },
            { letter: 'Xx', correct: { word: 'Xylophone', img: '🎹' }, wrong: { word: 'Guitar', img: '🎸' } },
            { letter: 'Yy', correct: { word: 'Yak', img: '🐂' }, wrong: { word: 'Cow', img: '🐄' } },
            { letter: 'Zz', correct: { word: 'Zebra', img: '🦓' }, wrong: { word: 'Horse', img: '🐴' } }
        ];

        let currentIndex = 0;

        const letterElement = document.getElementById('letter');
        const optionsContainer = document.getElementById('options');
        const feedbackElement = document.getElementById('feedback');
        const scoreElement = document.getElementById('score');
        const restartBtn = document.getElementById('restart-btn');

        function loadLevel() {
            const currentData = gameData[currentIndex];
            letterElement.textContent = currentData.letter;
            scoreElement.textContent = `المرحلة: ${currentIndex + 1} / 26`;
            feedbackElement.textContent = "";
            
            // خلط الخيارات (الصحيح والخطأ)
            const options = [currentData.correct, currentData.wrong];
            options.sort(() => Math.random() - 0.5);

            optionsContainer.innerHTML = '';
            
            // إنشاء البطاقات للخيارات
            options.forEach(opt => {
                const card = document.createElement('button');
                card.className = 'option-card';
                card.onclick = () => checkAnswer(opt.word, currentData.correct.word);
                
                // إضافة الصورة (أو الرمز التعبيري) والكلمة داخل البطاقة
                card.innerHTML = `
                    <div class="option-image">${opt.img}</div>
                    <div class="option-word">${opt.word}</div>
                `;
                
                optionsContainer.appendChild(card);
            });
        }

        function checkAnswer(selectedWord, correctWord) {
            const cards = optionsContainer.querySelectorAll('.option-card');
            cards.forEach(card => card.disabled = true);

            if (selectedWord === correctWord) {
                feedbackElement.textContent = "إجابة صحيحة! 🎉";
                feedbackElement.className = "feedback correct";
                
                // تأثير صوتي يمكن إضافته هنا
                setTimeout(() => {
                    currentIndex++;
                    if (currentIndex < gameData.length) {
                        loadLevel();
                    } else {
                        endGame();
                    }
                }, 1200);
            } else {
                feedbackElement.textContent = "حاول مرة أخرى ❌";
                feedbackElement.className = "feedback wrong";
                
                setTimeout(() => {
                    cards.forEach(card => card.disabled = false);
                    feedbackElement.textContent = "";
                }, 1200);
            }
        }

        function endGame() {
            letterElement.textContent = "👏";
            optionsContainer.innerHTML = "<h2>أحسنت! لقد أكملت جميع الحروف بنجاح!</h2>";
            scoreElement.textContent = "اكتملت اللعبة";
            feedbackElement.textContent = "";
            restartBtn.style.display = "block";
        }

        function restartGame() {
            currentIndex = 0;
            restartBtn.style.display = "none";
            loadLevel();
        }

        // بدء اللعبة
        loadLevel();
    </script>
</body>
</html>
